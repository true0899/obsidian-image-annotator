<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image Annotator QA</title>
<style>
:root { --background-primary:#fff; --background-secondary:#f1f2f4; --background-modifier-border:#d4d4d8; --text-normal:#202124; --text-muted:#62666c; --interactive-accent:#187a66; --text-on-accent:white; --font-ui-medium:16px; --font-ui-small:13px; --font-ui-smaller:12px; font-family:Arial,sans-serif; }
